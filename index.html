<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0081b1">
  <title>KPI Toà soạn – Báo Thanh Niên</title>
  <link rel="shortcut icon" href="https://thanhnien-static.mediacdn.vn/thanhnien.vn/image/tn-favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="lg-good" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7a0"/><stop offset="1" stop-color="#15803d"/></linearGradient>
      <linearGradient id="lg-warn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#d97706"/></linearGradient>
      <linearGradient id="lg-bad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
      <linearGradient id="lg-primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd0f5"/><stop offset="1" stop-color="#00618a"/></linearGradient>
      <linearGradient id="lg-white" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe9fa"/></linearGradient>
      <linearGradient id="vg-good" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
      <linearGradient id="vg-warn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></linearGradient>
      <linearGradient id="vg-bad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fecaca"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
      <linearGradient id="vg-primary" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a5e3f7"/><stop offset="1" stop-color="#0081b1"/></linearGradient>
      <linearGradient id="ag-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0098d1" stop-opacity=".38"/><stop offset="1" stop-color="#0098d1" stop-opacity="0"/></linearGradient>
      <linearGradient id="ln-primary" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    </defs>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Điều hướng"></aside>
    <div class="sidebar__backdrop" data-act="drawer-close"></div>
    <div class="shell">
      <header class="topbar" id="topbar"></header>
      <div class="draft" id="draft" hidden></div>
      <main class="page" id="page" tabindex="-1">
        <div class="loading"><span class="loading__dot"></span>Đang tải dữ liệu…</div>
      </main>
    </div>
    <nav class="bottomnav" id="bottomnav" aria-label="Điều hướng nhanh"></nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/xlsx-lite.js"></script>
  <script src="assets/kpi-parser.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
